site_name: gp3tools for Python
site_url: https://stefanosbalaskas.github.io/gp3tools-python/
site_author: Stefanos Balaskas
site_description: Reproducible Gazepoint GP3 eye-tracking analysis, quality control, pupillometry, AOI, scanpath, modelling, visualisation, and reporting workflows in Python.

repo_url: https://github.com/stefanosbalaskas/gp3tools-python
repo_name: stefanosbalaskas/gp3tools-python
edit_uri: edit/main/docs/

copyright: >
  Copyright &copy; 2026 Stefanos Balaskas ·
  Released under the MIT License

theme:
  name: material
  language: en
  icon:
    logo: material/eye
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stefanosbalaskas/gp3tools-python
      name: gp3tools Python on GitHub
    - icon: material/language-r
      link: https://github.com/stefanosbalaskas/gp3tools
      name: Original gp3tools R package
    - icon: material/book-open-variant
      link: https://doi.org/10.3390/jemr19040076
      name: Peer-reviewed gp3tools paper

