name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release.yml"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"
          python -m pip install "twine==7.0.0"

      - name: Validate stable version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import tomllib
          import gp3tools

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          if version != gp3tools.__version__:
              raise SystemExit(
                  f"Version mismatch: pyproject={version}, runtime={gp3tools.__version__}"
              )

          if any(token in version for token in ("dev", "a", "b", "rc")):
              raise SystemExit(f"Refusing non-stable release version: {version}")

          if version != "0.1.1":
              raise SystemExit(f"Expected release version 0.1.1, found {version}")

          if len(gp3tools.R_EXPORTS) != 278:
              raise SystemExit(
                  f"Expected 278 public R exports, found {len(gp3tools.R_EXPORTS)}"
              )

          print(f"Stable metadata contract: gp3tools {version}; 278 exports")
          PY

      - name: Ruff
        run: ruff check .

      - name: Full tests and 100 percent coverage
        run: |
          pytest -q \
            --cov=src/gp3tools \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=100

      - name: Build strict documentation
        run: mkdocs build --strict --site-dir site

      - name: Build distributions
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          test -f dist/gp3tools-0.1.1-py3-none-any.whl
          test -f dist/gp3tools-0.1.1.tar.gz
          sha256sum dist/* | tee dist/SHA256SUMS.txt

      - name: Validate installation from exact wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/gp3tools-release-wheel
          /tmp/gp3tools-release-wheel/bin/python -m pip install --upgrade pip
          /tmp/gp3tools-release-wheel/bin/python -m pip install dist/gp3tools-0.1.1-py3-none-any.whl
          /tmp/gp3tools-release-wheel/bin/python -m pip check
          cd /tmp
          /tmp/gp3tools-release-wheel/bin/python - <<'PY'
          import gp3tools

          assert gp3tools.__version__ == "0.1.1"
          assert len(gp3tools.R_EXPORTS) == 278
          print("Exact-wheel validation: PASS")
          PY

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gp3tools-0.1.1-release
          path: |
            dist/gp3tools-0.1.1-py3-none-any.whl
            dist/gp3tools-0.1.1.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create GitHub release and dispatch PyPI
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: gp3tools-0.1.1-release
          path: dist

      - name: Create or verify v0.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.1"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --tags origin "${TAG}"
            EXISTING_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${EXISTING_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "Existing tag ${TAG} points to ${EXISTING_SHA}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
          else
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "gp3tools 0.1.1"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; verifying attached distributions."
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets \
              --jq '.assets[].name' | grep -Fx "gp3tools-0.1.1-py3-none-any.whl"
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets \
              --jq '.assets[].name' | grep -Fx "gp3tools-0.1.1.tar.gz"
          else
            {
              echo "# gp3tools 0.1.1"
              echo
              echo "Stable coverage-hardening release."
              echo
              echo "- 1,424 tests passed"
              echo "- 16,546 / 16,546 executable statements covered (100.00%)"
              echo "- Python 3.11, 3.12, and 3.13 validated"
              echo "- 278-export public API contract validated"
              echo "- R4 compatibility coverage contract: 100%"
              echo "- strict documentation build validated"
              echo "- wheel/sdist and fresh-wheel installation validated"
              echo
              echo "## SHA256"
              echo
              sed 's/^/- /' dist/SHA256SUMS.txt
            } > release-notes.md

            gh release create "${TAG}" \
              dist/gp3tools-0.1.1-py3-none-any.whl \
              dist/gp3tools-0.1.1.tar.gz \
              dist/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "gp3tools 0.1.1" \
              --notes-file release-notes.md
          fi

      - name: Dispatch trusted PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pypi.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f tag=v0.1.1

          echo "Dispatched pypi.yml for v0.1.1"
