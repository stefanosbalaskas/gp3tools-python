name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Public API contract
        run: |
          python -c "import gp3tools as gp3; assert len(gp3.R_EXPORTS) == 278; print('278-export API contract: PASS')"

      - name: Tests
        if: matrix.python-version != '3.13'
        run: pytest -q

      - name: Tests and coverage gate
        if: matrix.python-version == '3.13'
        run: |
          pytest -q \
            --cov=src/gp3tools \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90


      - name: Examples smoke
        if: matrix.python-version == '3.13'
        run: |
          python examples/full_workflow.py
          python examples/pupil_qc.py
          python examples/plot_gallery.py

      - name: Build wheel and source distribution
        if: matrix.python-version == '3.13'
        run: |
          python -m build
          ls -lh dist
          test -n "$(find dist -name '*.whl' -print -quit)"
          test -n "$(find dist -name '*.tar.gz' -print -quit)"

      - name: Validate fresh wheel installation
        if: matrix.python-version == '3.13'
        run: |
          python -m venv /tmp/gp3tools-wheel
          /tmp/gp3tools-wheel/bin/python -m pip install --upgrade pip
          /tmp/gp3tools-wheel/bin/python -m pip install dist/*.whl
          /tmp/gp3tools-wheel/bin/python -m pip check

          cd /tmp

          /tmp/gp3tools-wheel/bin/python - <<'PY'
          import gp3tools as gp3

          print("version:", gp3.__version__)
          print("loaded:", gp3.__file__)
          print("exports:", len(gp3.R_EXPORTS))

          assert len(gp3.R_EXPORTS) == 278
          assert "site-packages" in gp3.__file__

          x = gp3.load_example_master()
          assert x.shape == (1440, 11)

          sampling = gp3.check_sampling_rate(
              x,
              time_col="TIME",
              group_cols=["subject"],
          )
          assert sampling["within_tolerance"].all()

          fig = gp3.plot_sampling_rate(
              x,
              time_col="TIME",
              group_cols=["subject"],
          )
          assert fig is not None

          print("FRESH WHEEL VALIDATION: PASS")
          PY
