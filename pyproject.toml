[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gp3tools"
version = "0.1.0a1"
description = "Python implementation and compatibility layer for reproducible Gazepoint GP3 analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Stefanos Balaskas"}]
keywords = ["eye-tracking", "eyetracking", "Gazepoint", "GP3", "pupillometry", "AOI", "scanpath", "HCI"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "networkx>=3.3",
  "shapely>=2.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
bayes = ["pymc>=5", "arviz>=0.19", "bambi>=0.15"]
rbridge = ["rpy2>=3.6"]
dashboard = ["shiny>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/stefanosbalaskas/gp3tools"
Documentation = "https://stefanosbalaskas.github.io/gp3tools/"
Issues = "https://github.com/stefanosbalaskas/gp3tools/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gp3tools = ["data/*.csv", "data/*.json", "py.typed", "api_manifest.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
